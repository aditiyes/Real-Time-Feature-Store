services:
  - type: keyvalue
    name: retail-risk-features
    plan: free
    ipAllowList: []

  - type: web
    name: retail-risk-feature-store
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: retail-risk-features
          property: connectionString